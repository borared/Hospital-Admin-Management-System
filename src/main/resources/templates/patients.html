<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 30px;
        }

        .header {
            max-width: 1200px;
            margin: 0 auto 25px;
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .header h2 {
            font-weight: 600;
            color: #333;
        }

        .header-buttons a {
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-left: 10px;
            transition: 0.2s ease;
        }

        .btn-home {
            background: #858796;
            color: white;
        }

        .btn-home:hover {
            background: #6c757d;
            transform: translateY(-2px);
        }

        .btn-logout {
            background: #e74a3b;
            color: white;
        }

        .btn-logout:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 25px;
            font-size: 26px;
            color: #333;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .action-buttons a {
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            color: white;
            transition: 0.2s ease;
        }

        .btn-add { background: #1cc88a; }
        .btn-add:hover { background: #17a673; transform: translateY(-2px); }

        .btn-search { background: #36b9cc; }
        .btn-search:hover { background: #2c9faf; transform: translateY(-2px); }

        .btn-refresh { background: #4e73df; }
        .btn-refresh:hover { background: #2e59d9; transform: translateY(-2px); }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 12px;
        }

        thead {
            background: #4e73df;
            color: white;
        }

        th, td {
            padding: 14px;
            text-align: left;
            font-size: 14px;
        }

        tbody tr {
            border-bottom: 1px solid #eee;
            transition: 0.2s ease;
        }

        tbody tr:hover {
            background: #f8f9fc;
        }

        .action-cell {
            display: flex;
            gap: 8px;
        }

        .btn-edit {
            background: #f6c23e;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            color: #333;
            font-weight: 500;
            transition: 0.2s ease;
        }

        .btn-edit:hover {
            background: #dda20a;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #e74a3b;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            color: white;
            font-weight: 500;
            transition: 0.2s ease;
        }

        .btn-delete:hover {
            background: #c0392b;
            transform: translateY(-1px);
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        .total {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header, .container {
                padding: 20px;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h2>Patient Management</h2>
    <div class="header-buttons">
        <a th:href="@{/}" class="btn-home">Dashboard</a>
        <a th:href="@{/logout}" class="btn-logout">Logout</a>
    </div>
</div>

<div class="container">

    <h1>Patient List</h1>

    <div class="action-buttons">
        <a th:href="@{/patients/add}" class="btn-add">+ Add Patient</a>
        <a th:href="@{/patients/search}" class="btn-search">🔍 Search</a>
        <a th:href="@{/patients}" class="btn-refresh">↻ Refresh</a>
    </div>

    <div th:if="${patients.isEmpty()}" class="no-data">
        <p>No patients found in the system.</p>
    </div>

    <table th:if="${!patients.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Date of Birth</th>
            <th>Address</th>
            <th>Disease</th>
            <th>Entry Date</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="patient : ${patients}">
            <td th:text="${patient.id}">P001</td>
            <td th:text="${patient.name}">Jane Smith</td>
            <td th:text="${patient.dob}">15/05/1990</td>
            <td th:text="${patient.address}">456 Oak Ave</td>
            <td th:text="${patient.disease}">Flu</td>
            <td th:text="${patient.entryDate}">10/02/2024</td>
            <td>
                <div class="action-cell">
                    <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn-edit">Edit</a>
                    <a th:href="@{/patients/delete/{id}(id=${patient.id})}"
                       class="btn-delete"
                       onclick="return confirm('Are you sure you want to delete this patient?')">
                        Delete
                    </a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${!patients.isEmpty()}" class="total">
        Total Patients: <span th:text="${patients.size()}">0</span>
    </p>

</div>

</body>
</html>
