<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Doctor - Admin Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #e3e9f0);
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 40px;
            font-weight: 600;
            color: #374151;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .back-link:hover {
            color: #3730a3;
            transform: translateX(-3px);
        }

        .search-form {
            background: #f9fafb;
            padding: 30px;
            border-radius: 14px;
            margin-bottom: 35px;
            border: 1px solid #e5e7eb;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            max-width: 420px;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            background-color: #ffffff;
            transition: 0.2s ease;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
        }

        .btn-search {
            padding: 12px 28px;
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s ease;
            margin-top: 10px;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(6,182,212,0.25);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            border-radius: 12px;
            overflow: hidden;
        }

        thead {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: white;
        }

        th {
            padding: 14px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
            color: #374151;
        }

        tbody tr {
            transition: 0.2s ease;
        }

        tbody tr:hover {
            background-color: #f9fafb;
        }

        .no-results {
            text-align: center;
            padding: 50px;
            margin-top: 25px;
            border-radius: 12px;
            background: #fff7ed;
            border: 1px solid #fdba74;
            color: #92400e;
            font-weight: 600;
        }

        p {
            font-size: 14px;
            color: #6b7280;
        }

        @media (max-width: 900px) {
            .container {
                padding: 25px;
            }

            .form-group select,
            .form-group input {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <a th:href="@{/doctors}" class="back-link">← Back to Doctor List</a>
        <h1>Search Doctor</h1>
        
        <div class="search-form">
            <form th:action="@{/doctors/search}" method="post">
                <div class="form-group">
                    <label for="searchType">Search By:</label>
                    <select id="searchType" name="searchType" required>
                        <option value="id">Doctor ID</option>
                        <option value="name">Doctor Name</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="searchValue">Search Value:</label>
                    <input type="text" id="searchValue" name="searchValue" required placeholder="Enter ID or Name">
                </div>
                
                <button type="submit" class="btn-search">🔍 Search</button>
            </form>
        </div>
        
        <div th:if="${searched != null}">
            <h2>Search Results</h2>
            
            <div th:if="${doctors.isEmpty()}" class="no-results">
                <p><strong>No doctors found matching your search criteria.</strong></p>
            </div>
            
            <table th:if="${!doctors.isEmpty()}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Date of Birth</th>
                        <th>Address</th>
                        <th>Email</th>
                        <th>Position</th>
                        <th>Salary</th>
                        <th>Entry Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="doctor : ${doctors}">
                        <td th:text="${doctor.id}">D001</td>
                        <td th:text="${doctor.name}">John Doe</td>
                        <td th:text="${doctor.dob}">01/01/1980</td>
                        <td th:text="${doctor.address}">123 Main St</td>
                        <td th:text="${doctor.email}">doctor@example.com</td>
                        <td th:text="${doctor.position}">Cardiologist</td>
                        <td th:text="${'$' + #numbers.formatDecimal(doctor.salary, 1, 2)}">$75000.00</td>
                        <td th:text="${doctor.doe}">01/01/2020</td>
                    </tr>
                </tbody>
            </table>
            
            <p th:if="${!doctors.isEmpty()}" style="margin-top: 25px;">
                Found <span th:text="${doctors.size()}">0</span> doctor(s)
            </p>
        </div>
    </div>
</body>
</html>
