<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Doctor - Admin Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #e3e9f0);
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: 600;
            color: #1f2937;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .back-link:hover {
            color: #3730a3;
            transform: translateX(-3px);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            background-color: #f9fafb;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
        }

        .form-group input:disabled {
            background-color: #e5e7eb;
            cursor: not-allowed;
            color: #6b7280;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        .btn-submit {
            padding: 12px 28px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245,158,11,0.25);
        }

        .btn-cancel {
            padding: 12px 28px;
            background: #e5e7eb;
            color: #374151;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s ease;
            margin-left: 10px;
        }

        .btn-cancel:hover {
            background: #d1d5db;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <a th:href="@{/doctors}" class="back-link">← Back to Doctor List</a>
        <h1>Edit Doctor</h1>
        
        <form th:action="@{/doctors/edit/{id}(id=${doctor.id})}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label for="id">Doctor ID</label>
                    <input type="text" id="id" th:value="${doctor.id}" disabled>
                </div>
                
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" name="name" th:value="${doctor.name}" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="dob">Date of Birth *</label>
                    <input type="text" id="dob" name="dob" th:value="${doctor.dob}" required placeholder="dd/mm/yyyy">
                </div>
                
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" th:value="${doctor.email}" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="address">Address *</label>
                <input type="text" id="address" name="address" th:value="${doctor.address}" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="position">Position *</label>
                    <input type="text" id="position" name="position" th:value="${doctor.position}" required>
                </div>
                
                <div class="form-group">
                    <label for="salary">Salary *</label>
                    <input type="number" id="salary" name="salary" step="0.01" th:value="${doctor.salary}" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="doe">Date of Entry *</label>
                <input type="text" id="doe" name="doe" th:value="${doctor.doe}" required placeholder="dd/mm/yyyy">
            </div>
            
            <div style="margin-top: 30px;">
                <button type="submit" class="btn-submit">Update Doctor</button>
                <a th:href="@{/doctors}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
