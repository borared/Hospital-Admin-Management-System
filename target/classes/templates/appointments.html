<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Management - Admin Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #e3e9f0);
            padding: 40px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 25px;
            padding: 20px 35px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        .header h2 {
            margin: 0;
            font-weight: 600;
            color: #1f2937;
        }

        .header-buttons a {
            margin-left: 12px;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.2s ease;
            color: white;
        }

        .btn-home {
            background: #6b7280;
        }

        .btn-home:hover {
            background: #4b5563;
            transform: translateY(-2px);
        }

        .btn-logout {
            background: #ef4444;
        }

        .btn-logout:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-weight: 600;
            color: #1f2937;
        }

        .action-buttons {
            margin: 25px 0;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-buttons a {
            padding: 10px 22px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s ease;
            color: white;
        }

        .btn-add {
            background: linear-gradient(135deg, #16a34a, #15803d);
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(22,163,74,0.25);
        }

        .btn-refresh {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59,130,246,0.25);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
        }

        thead {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: white;
        }

        th {
            padding: 14px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
            color: #374151;
        }

        tbody tr {
            transition: 0.2s ease;
        }

        tbody tr:hover {
            background-color: #f9fafb;
        }

        .no-data {
            text-align: center;
            padding: 60px;
            color: #6b7280;
            font-size: 16px;
        }

        .btn-delete {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            color: white;
            background: #ef4444;
            transition: 0.2s ease;
        }

        .btn-delete:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }

        p {
            font-size: 14px;
            color: #6b7280;
        }

        @media (max-width: 900px) {
            .container {
                padding: 25px;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h2>Appointment Management</h2>
        <div class="header-buttons">
            <a th:href="@{/}" class="btn-home">Dashboard</a>
            <a th:href="@{/logout}" class="btn-logout">Logout</a>
        </div>
    </div>
    
    <div class="container">
        <h1>Appointment List</h1>
        
        <div class="action-buttons">
            <a th:href="@{/appointments/add}" class="btn-add">+ Schedule Appointment</a>
            <a th:href="@{/appointments}" class="btn-refresh">↻ Refresh</a>
        </div>
        
        <div th:if="${appointments.isEmpty()}" class="no-data">
            <p>No appointments scheduled.</p>
        </div>
        
        <table th:if="${!appointments.isEmpty()}">
            <thead>
                <tr>
                    <th>Patient ID</th>
                    <th>Patient Name</th>
                    <th>Date of Birth</th>
                    <th>Phone Number</th>
                    <th>Disease</th>
                    <th>Appointment Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="appointment : ${appointments}">
                    <td th:text="${appointment.patientId}">P001</td>
                    <td th:text="${appointment.patientName}">Jane Smith</td>
                    <td th:text="${appointment.patientDOB}">15/05/1990</td>
                    <td th:text="${appointment.patientPhoneNum}">1234567890</td>
                    <td th:text="${appointment.patientDisease}">Flu</td>
                    <td th:text="${appointment.DOA}">10/03/2024</td>
                    <td>
                        <a th:href="@{/appointments/delete/{id}(id=${appointment.patientId})}"
                           class="btn-delete"
                           onclick="return confirm('Are you sure you want to cancel this appointment?')">
                           Cancel
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <p th:if="${!appointments.isEmpty()}" style="margin-top: 25px;">
            Total Appointments: <span th:text="${appointments.size()}">0</span>
        </p>
    </div>
</body>
</html>
