<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Staff</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .info-box {
            background-color: #e7f3ff;
            border-left: 4px solid #007bff;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .info-box p {
            margin: 5px 0;
            color: #004085;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #667eea;
            font-weight: 500;
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
        }

        input, select {
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            outline: none;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .btn-primary {
            background: #1cc88a;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-primary:hover {
            background: #17a673;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #858796;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .btn-secondary:hover {
            background: #6c757d;
            transform: translateY(-2px);
        }
    </style>
    
    <script>
        function showWardField() {
            var position = document.getElementById('position').value;
            var wardField = document.getElementById('wardField');
            
            // Show ward field only if position contains "Nurse"
            if (position.toLowerCase().includes('nurse')) {
                wardField.style.display = 'block';
            } else {
                wardField.style.display = 'none';
            }
        }
    </script>
</head>

<body>

<div class="card">
    <a th:href="@{/staff}" class="back-link">← Back to Staff List</a>

    <div class="header">
        <h1>Add New Staff Member</h1>
        
        <div class="info-box">
            <p><strong>Position-Based Storage:</strong></p>
            <p>• <strong>Surgeon</strong> → Stored in Surgeon list</p>
            <p>• <strong>Cardiologist</strong> → Stored in Cardiologist list</p>
            <p>• <strong>Nurse</strong> → Stored in Nurse list</p>
            <p>• <strong>Other positions</strong> → Stored in Doctor list</p>
        </div>
    </div>

    <form th:action="@{/staff/add}" method="post">

        <div class="form-grid">

            <div class="form-group">
                <label>Staff ID *</label>
                <input type="text" name="id" placeholder="S001" required>
            </div>

            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" name="name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label>Date of Birth *</label>
                <input type="date" name="dob" required>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" placeholder="john@hospital.com" required>
            </div>

            <div class="form-group">
                <label>Position * (Important!)</label>
                <select name="position" id="position" required onchange="showWardField()">
                    <option value="">-- Select Position --</option>
                    <optgroup label="Medical Staff">
                        <option value="Surgeon">Surgeon</option>
                        <option value="Cardiologist">Cardiologist</option>
                        <option value="General Practitioner">General Practitioner</option>
                        <option value="Pediatrician">Pediatrician</option>
                        <option value="Neurologist">Neurologist</option>
                    </optgroup>
                    <optgroup label="Nursing Staff">
                        <option value="Nurse">Registered Nurse</option>
                        <option value="Head Nurse">Head Nurse</option>
                        <option value="ICU Nurse">ICU Nurse</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group" id="wardField" style="display: none;">
                <label>Ward * (For Nurses)</label>
                <select name="ward">
                    <option value="General Ward">General Ward</option>
                    <option value="ICU">ICU (Intensive Care Unit)</option>
                    <option value="Emergency Room">Emergency Room</option>
                    <option value="Pediatrics">Pediatrics</option>
                    <option value="Maternity">Maternity Ward</option>
                    <option value="Surgery">Surgery Ward</option>
                    <option value="Oncology">Oncology</option>
                    <option value="Cardiology">Cardiology Ward</option>
                </select>
            </div>

            <div class="form-group">
                <label>Salary *</label>
                <input type="number" name="salary" step="0.01" placeholder="50000.00" required>
            </div>

            <div class="form-group">
                <label>Address *</label>
                <input type="text" name="address" placeholder="123 Main Street" required>
            </div>

            <div class="form-group">
                <label>Date of Employment *</label>
                <input type="date" name="doe" required>
            </div>

        </div>

        <div class="buttons">
            <button type="submit" class="btn-primary">Add Staff Member</button>
            <a th:href="@{/staff}" class="btn-secondary">Cancel</a>
        </div>

    </form>

</div>

</body>
</html>
