<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Appointment</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .header p {
            color: #666;
            margin-top: 5px;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #4e73df;
            font-weight: 500;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
        }

        input {
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 3px rgba(78, 115, 223, 0.2);
            outline: none;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: #1cc88a;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-primary:hover {
            background: #17a673;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #858796;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .btn-secondary:hover {
            background: #6c757d;
            transform: translateY(-2px);
        }

        .info-box {
             background-color: #e7f3ff; 
             border-left: 4px solid #007bff; 
             padding: 15px; margin-bottom: 20px; 
             border-radius: 4px; 
             margin-top: 15px;
        } 
        
        .info-box p { 
            margin: 0; 
            color: #004085; 
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <a th:href="@{/appointments}" class="back-link">← Back to Appointments</a>

    <div class="header">
        <h1>Schedule New Appointment</h1>
        <div class="info-box"> <p><strong>Note:</strong> Please ensure all patient information is accurate before scheduling.</p> </div>
    </div>

    <form th:action="@{/appointments/add}" method="post">

        <div class="form-grid">

            <div class="form-group">
                <label>Patient ID</label>
                <input type="text" name="patientId" placeholder="P001" required>
            </div>

            <div class="form-group">
                <label>Patient Name</label>
                <input type="text" name="patientName" placeholder="Jane Smith" required>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" name="patientDOB" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phoneNumber" pattern="[0-9]{8,10}" placeholder="1234567890" required>
            </div>

            <div class="form-group full-width">
                <label>Disease / Condition</label>
                <input type="text" name="disease" placeholder="Flu, Fever, Checkup..." required>
            </div>

            <div class="form-group full-width">
                <label>Appointment Date</label>
                <input type="date" name="doa" required>
            </div>

        </div>

        <div class="buttons">
            <button type="submit" class="btn-primary">Schedule Appointment</button>
            <a th:href="@{/appointments}" class="btn-secondary">Cancel</a>
        </div>

    </form>

</div>

</body>
</html>
