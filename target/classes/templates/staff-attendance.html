<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2f7, #e3e9f0);
            padding: 40px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto 25px;
            padding: 20px 35px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        .header h2 {
            margin: 0;
            font-weight: 600;
            color: #1f2937;
        }

        .header-buttons a {
            margin-left: 12px;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.2s ease;
            color: white;
        }

        .btn-scan {
            background: #667eea;
        }

        .btn-back {
            background: #6b7280;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-weight: 600;
            color: #1f2937;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .stat-card {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            color: white;
        }

        .stat-card h3 {
            font-size: 36px;
            margin-bottom: 5px;
        }

        .stat-card.active {
            background: linear-gradient(135deg, #1cc88a, #17a673);
        }

        .stat-card.inactive {
            background: linear-gradient(135deg, #e74a3b, #be2617);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
        }

        thead {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: white;
        }

        th {
            padding: 14px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
            color: #374151;
        }

        tbody tr:hover {
            background-color: #f9fafb;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .time-info {
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div class="header">
        <h2>📊 Staff Attendance Report</h2>
        <div class="header-buttons">
            <a th:href="@{/staff/qr-scanner}" class="btn-scan">📷 QR Scanner</a>
            <a th:href="@{/staff}" class="btn-back">← Back to Staff</a>
        </div>
    </div>
    
    <div class="container">
        <h1>Real-Time Attendance Status</h1>
        
        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card active">
                <h3 th:text="${activeCount}">0</h3>
                <p>Active Staff</p>
            </div>
            <div class="stat-card inactive">
                <h3 th:text="${inactiveCount}">0</h3>
                <p>Inactive Staff</p>
            </div>
        </div>
        
        <!-- Attendance Table -->
        <table th:if="${!allStaff.isEmpty()}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Position</th>
                    <th>Status</th>
                    <th>Last Check-In</th>
                    <th>Last Check-Out</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="staff : ${allStaff}">
                    <td th:text="${staff.id}">S001</td>
                    <td th:text="${staff.name}">John Doe</td>
                    <td th:text="${staff.position}">Doctor</td>
                    <td>
                        <span th:if="${staff.active}" class="status-badge status-active">🟢 ACTIVE</span>
                        <span th:if="${!staff.active}" class="status-badge status-inactive">🔴 INACTIVE</span>
                    </td>
                    <td>
                        <span th:if="${staff.lastCheckIn}" class="time-info" 
                              th:text="${#temporals.format(staff.lastCheckIn, 'yyyy-MM-dd HH:mm:ss')}">-</span>
                        <span th:unless="${staff.lastCheckIn}" class="time-info">Never</span>
                    </td>
                    <td>
                        <span th:if="${staff.lastCheckOut}" class="time-info" 
                              th:text="${#temporals.format(staff.lastCheckOut, 'yyyy-MM-dd HH:mm:ss')}">-</span>
                        <span th:unless="${staff.lastCheckOut}" class="time-info">Never</span>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <p th:if="${allStaff.isEmpty()}" style="text-align: center; padding: 60px; color: #6b7280;">
            No staff members found.
        </p>
    </div>
</body>
</html>
